[tools]
node = "24.18.0"
pnpm = "11.15.1"

[env]
_.path = "node_modules/.bin"

[tasks.lint]
description = "Runs all code quality checks (linting, types, dependencies)"
depends = ["lint:*"]

[tasks.publish]
description = "Publish changesets with pnpm"
depends = ["build"]
run = "pnpm exec changeset publish"

# Individual tasks
[tasks.dev]
description = "Start the dev environment"
run = "tsdown --watch ./src"

[tasks.format]
description = "Format all files"
run = "prettier --write ."

[tasks.build]
description = "Build package with tsdown"
run = "tsdown"

[tasks.test]
description = "Run functionality tests with vitest"
run = "vitest run"

[tasks."lint:oxlint"]
description = "Lint source with oxlint"
run = "oxlint"

[tasks."lint:tsc"]
description = "Run type checks"
run = "tsc --noEmit"

[tasks."lint:knip"]
description = "Audit source with knip"
run = "knip"

[tasks."lint:prettier"]
description = "Check code style with prettier"
run = "prettier --check ."
